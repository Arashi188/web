<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bright Future School</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <h2><i class="fas fa-graduation-cap"></i> Bright Future School</h2>
                </div>
                <ul class="nav-menu">
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-container">
            <div class="login-header">
                <h2 id="loginTitle">Select Login Type</h2>
                <p>Choose your role to continue</p>
            </div>

            <!-- Role Selection -->
            <div class="role-selection" id="roleSelection">
                <div class="role-card" onclick="setLoginRole('student')">
                    <i class="fas fa-user-graduate"></i>
                    <h3>Student</h3>
                    <p>Access your grades and assignments</p>
                </div>
                <div class="role-card" onclick="setLoginRole('teacher')">
                    <i class="fas fa-chalkboard-teacher"></i>
                    <h3>Teacher</h3>
                    <p>Manage classes and grades</p>
                </div>
                <div class="role-card" onclick="setLoginRole('parent')">
                    <i class="fas fa-users"></i>
                    <h3>Parent</h3>
                    <p>Track student progress</p>
                </div>
            </div>

            <!-- Login Form -->
            <div class="login-form" id="loginForm" style="display: none;">
                <form id="loginFormElement" onsubmit="handleLogin(event)">
                    <input type="hidden" id="userRole" name="role">
                    
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login">
                        <span id="loginText">Login</span>
                        <div class="spinner" id="loginSpinner" style="display: none;"></div>
                    </button>
                </form>
                
                <div class="back-link">
                    <a href="#" onclick="showRoleSelection()"><i class="fas fa-arrow-left"></i> Back to role selection</a>
                </div>
            </div>

            <div id="loginMessage" class="message"></div>
        </div>
    </section>

    <script src="js/login.js"></script>
</body>
</html>
