<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams & Tests - Student Portal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/exams.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <h2><i class="fas fa-user-graduate"></i> Exams & Tests</h2>
                </div>
                <ul class="nav-menu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="student-exam.html" class="active">Exams</a></li>
                    <li><a href="practice.html">Practice Tests</a></li>
                    <li><a href="assignments.html">Assignments</a></li>
                    <li><a href="../php/logout.php">Logout</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="exams-section">
        <div class="container">
            <div class="exams-header">
                <h1>Examinations & Tests</h1>
                <p>Access your scheduled exams and track your exam history</p>
            </div>

            <!-- Exam Statistics -->
            <div class="exam-stats">
                <div class="stat-card">
                    <i class="fas fa-calendar-check"></i>
                    <div class="stat-number" id="upcomingCount">0</div>
                    <div class="stat-label">Upcoming Exams</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-history"></i>
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-chart-line"></i>
                    <div class="stat-number" id="averageScore">-</div>
                    <div class="stat-label">Average Score</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <!-- Upcoming Exams -->
            <div class="exams-category">
                <h2><i class="fas fa-clock"></i> Upcoming Exams</h2>
                <div class="exams-grid" id="upcomingExams">
                    <!-- Upcoming exams will be loaded here -->
                </div>
            </div>

            <!-- Active Exams -->
            <div class="exams-category">
                <h2><i class="fas fa-play-circle"></i> Active Exams</h2>
                <div class="exams-grid" id="activeExams">
                    <!-- Active exams will be loaded here -->
                </div>
            </div>

            <!-- Exam History -->
            <div class="exams-category">
                <h2><i class="fas fa-history"></i> Exam History</h2>
                <div class="exam-history" id="examHistory">
                    <!-- Exam history will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Exam Details Modal -->
    <div id="examDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="examModalTitle">Exam Details</h3>
                <span class="close" onclick="closeExamDetailsModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="exam-details" id="examDetailsContent">
                    <!-- Exam details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="../js/student_exams.js"></script>
</body>
</html>
