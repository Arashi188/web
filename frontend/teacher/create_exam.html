<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - Teacher Portal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/teacher.css">
    <link rel="stylesheet" href="../css/exam_creation.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <h2><i class="fas fa-chalkboard-teacher"></i> Create Exam</h2>
                </div>
                <ul class="nav-menu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="exams.html">Exams</a></li>
                    <li><a href="create_exam.html" class="active">Create Exam</a></li>
                    <li><a href="assignments.html">Assignments</a></li>
                    <li><a href="../php/logout.php">Logout</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="create-exam-section">
        <div class="container">
            <div class="create-exam-header">
                <h1>Create New Exam/Test</h1>
                <p>Create exams, tests, or practice questions for your students</p>
            </div>

            <form id="examForm" onsubmit="saveExam(event)">
                <!-- Basic Exam Information -->
                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> Exam Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="examTitle">Exam Title *</label>
                            <input type="text" id="examTitle" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="examType">Exam Type *</label>
                            <select id="examType" name="exam_type" required onchange="togglePracticeType()">
                                <option value="test">Class Test</option>
                                <option value="exam">Term Exam</option>
                                <option value="practice">Practice Test</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="practiceType" id="practiceTypeLabel" style="display: none;">Practice Type</label>
                            <select id="practiceType" name="practice_type" style="display: none;">
                                <option value="">Select Exam Type</option>
                                <option value="WAEC">WAEC</option>
                                <option value="NECO">NECO</option>
                                <option value="JAMB">JAMB</option>
                                <option value="GCE">GCE</option>
                                <option value="BECE">BECE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="examClass">Class *</label>
                            <select id="examClass" name="class_id" required>
                                <option value="">Select Class</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="examSubject">Subject *</label>
                            <select id="examSubject" name="subject_id" required>
                                <option value="">Select Subject</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="duration">Duration (minutes) *</label>
                            <input type="number" id="duration" name="duration" min="5" max="180" required>
                        </div>
                        <div class="form-group">
                            <label for="totalMarks">Total Marks *</label>
                            <input type="number" id="totalMarks" name="total_marks" min="1" step="0.5" required>
                        </div>
                        <div class="form-group">
                            <label for="passingMarks">Passing Marks</label>
                            <input type="number" id="passingMarks" name="passing_marks" min="0" step="0.5">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate">Start Date & Time</label>
                            <input type="datetime-local" id="startDate" name="start_date">
                        </div>
                        <div class="form-group">
                            <label for="endDate">End Date & Time</label>
                            <input type="datetime-local" id="endDate" name="end_date">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="examDescription">Description</label>
                        <textarea id="examDescription" name="description" rows="3"></textarea>
                    </div>
                </div>

                <!-- Questions Section -->
                <div class="form-section">
                    <div class="section-header">
                        <h3><i class="fas fa-question-circle"></i> Exam Questions</h3>
                        <button type="button" class="btn btn-secondary" onclick="addQuestion()">
                            <i class="fas fa-plus"></i> Add Question
                        </button>
                    </div>
                    
                    <div id="questionsContainer">
                        <!-- Questions will be added here dynamically -->
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="saveDraft()">
                        <i class="fas fa-save"></i> Save Draft
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Publish Exam
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- Question Template (Hidden) -->
    <div id="questionTemplate" style="display: none;">
        <div class="question-card" data-question-id="">
            <div class="question-header">
                <h4>Question <span class="question-number">1</span></h4>
                    <button type="button" class="btn-small btn-danger" onclick="removeQuestion(this)">
                        <i class="fas fa-trash"></i>
                    </button>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Question Type *</label>
                    <select name="question_type[]" required onchange="toggleQuestionOptions(this)">
                        <option value="multiple_choice">Multiple Choice</option>
                        <option value="true_false">True/False</option>
                        <option value="short_answer">Short Answer</option>
                        <option value="essay">Essay</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks *</label>
                    <input type="number" name="marks[]" min="0.5" step="0.5" required>
                </div>
            </div>

            <div class="form-group">
                <label>Question Text *</label>
                <textarea name="question_text[]" rows="3" required></textarea>
            </div>

            <!-- Multiple Choice Options -->
            <div class="question-options multiple-choice-options">
                <div class="form-row">
                    <div class="form-group option-group">
                        <label>Option A *</label>
                        <input type="text" name="option_a[]">
                    </div>
                    <div class="form-group option-group">
                        <label>Option B *</label>
                        <input type="text" name="option_b[]">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group option-group">
                        <label>Option C</label>
                        <input type="text" name="option_c[]">
                    </div>
                    <div class="form-group option-group">
                        <label>Option D</label>
                        <input type="text" name="option_d[]">
                    </div>
                </div>
                <div class="form-group">
                    <label>Correct Answer *</label>
                    <select name="correct_answer[]">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>

            <!-- True/False Options -->
            <div class="question-options true-false-options" style="display: none;">
                <div class="form-group">
                    <label>Correct Answer *</label>
                    <select name="correct_answer_tf[]">
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Explanation (Optional)</label>
                <textarea name="explanation[]" rows="2"></textarea>
            </div>
        </div>
    </div>

    <script src="../js/exam_creation.js"></script>
</body>
</html>
